name: Full notebook regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MODULARRL_FAST: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU runtime and notebook tools
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[dev,notebooks]'
      - name: Unit, integration and notebook tests
        run: python -m pytest -q
