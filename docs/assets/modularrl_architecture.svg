<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="838" viewBox="0 0 1400 838" role="img" aria-labelledby="title desc">
<title id="title">ModularRL architecture</title><desc id="desc">ModularRL component architecture. The external environment provides observations to the Model and real transitions to experience buffers and, optionally, directly to a TabularWorldModel via observe(). The Model connects InputAdapter, Representation, Estimator and ActionSelector, which supplies actions to the environment. The Learner performs forward evaluation and orchestrates the grouped learning flow from TargetGenerator to UpdateRule to Optimizer. For neural learning, the Learner calls loss.backward() and optimizer.step(); the optimizer updates only its registered learnable Representation and Estimator parameters. A dashed learnable-parameters box encloses Representation and Estimator, excluding InputAdapter and ActionSelector. The parameter update feedback path ends at that box. Tabular UpdateRules directly update Q/V tables in the Model without an Optimizer. Optional DynaPlanner samples the TabularWorldModel and invokes the same Learner. The external training loop owns collection, environment steps and scheduling.</desc>
