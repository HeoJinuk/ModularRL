<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="838" viewBox="0 0 1400 838" role="img" aria-labelledby="title desc">
<title id="title">ModularRL architecture</title><desc id="desc">ModularRL component architecture. The external environment provides observations to the Model and real transitions to experience buffers and, optionally, directly to a TabularWorldModel via observe(). The Model connects InputAdapter, Representation, Estimator and ActionSelector, which supplies actions to the environment. The Learner reuses the Model, TargetGenerator and UpdateRule, with an Optimizer for neural learners. Optional DynaPlanner samples the TabularWorldModel and invokes the same Learner. The external training loop owns collection, environment steps and scheduling.</desc>
