[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "modularrl-model-contract-demo"
version = "0.1.0"
description = "Composable reinforcement learning components for education and research, from tabular methods to PPO"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Jinuk Huh"}]
keywords = ["reinforcement-learning", "pytorch", "education", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "torch>=2.0", "gymnasium>=1.0"]

[project.urls]
Repository = "https://github.com/HeoJinuk/ModularRL"

[project.optional-dependencies]
examples = []  # Compatibility extra; Gymnasium is now a required dependency.
notebooks = ["matplotlib>=3.8", "nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6.29", "jupyterlab>=4.0"]
test = ["pytest>=8"]
dev = ["pytest>=8", "build>=1.2", "twine>=6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["modular_rl*"]
exclude = ["tests*", "notebooks*", "examples*", "experiments*"]

[tool.setuptools]
include-package-data = false
